<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- ResearchFlow Gold Symbol Favicon -->
  <defs>
    <linearGradient id="rf-gold-g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#F5D77F" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="rf-gold-g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B38728" />
    </linearGradient>
  </defs>

  <style>
    .rf-gold-ribbon { fill: url(#rf-gold-g1); }
    .rf-gold-thrust { fill: url(#rf-gold-g2); }
  </style>

  <!-- Signal 1: Upper Flow Ribbon (Crown of R & Top Bar of F) -->
  <path
    class="rf-gold-ribbon"
    d="M8 14.5 C8 11.5 10.5 9 13.5 9 H36 C44.837 9 52 16.163 52 25 C52 33.837 44.837 41 36 41 H28 V 33 H36 C40.418 33 44 29.418 44 25 C44 20.582 40.418 17 36 17 H13.5 C10.5 17 8 14.5 8 14.5 Z"
  />

  <!-- Signal 2: Middle Flow Ribbon (Inflow & Center Alignment) -->
  <rect class="rf-gold-ribbon" x="8" y="22" width="16" height="7" rx="3.5" />

  <!-- Signal 3: Lower Inflow Ribbon -->
  <rect class="rf-gold-ribbon" x="8" y="35" width="14" height="7" rx="3.5" />

  <!-- The Convergence Vector: Dynamic 45° Forward Execution Thrust -->
  <path
    class="rf-gold-thrust"
    d="M26 31.5 L46.8 52.3 C48.4 53.9 51 53.9 52.6 52.3 C54.2 50.7 54.2 48.1 52.6 46.5 L34.5 28.4 C32 25.9 27.5 27.7 26 31.5 Z"
  />
</svg>
