<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- ResearchFlow App Icon Squircle Canvas -->
  <rect width="512" height="512" rx="115" fill="#090A0F" />
  <rect x="8" y="8" width="496" height="496" rx="107" stroke="#312E81" stroke-width="4" stroke-opacity="0.5" />

  <defs>
    <radialGradient id="app-glow-flow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#4F46E5" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#090A0F" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="app-symbol-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="40%" stopColor="#60A5FA" />
      <stop offset="80%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#06B6D4" />
