    <!-- Signal 2: Mid Stream -->
    <rect x="8" y="22" width="16" height="7" rx="3.5" fill="url(#app-symbol-flow)" />
    <!-- Signal 3: Lower Stream -->
    <rect x="8" y="35" width="14" height="7" rx="3.5" fill="url(#app-symbol-flow)" />
    <!-- Execution Vector -->
    <path
      d="M26 31.5 L46.8 52.3 C48.4 53.9 51 53.9 52.6 52.3 C54.2 50.7 54.2 48.1 52.6 46.5 L34.5 28.4 C32 25.9 27.5 27.7 26 31.5 Z"
