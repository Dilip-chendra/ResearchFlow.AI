<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- ResearchFlow Social Share Open Graph Canvas -->
  <rect width="1200" height="630" fill="#090A0F" />

  <defs>
    <radialGradient id="og-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#4F46E5" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#090A0F" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="og-flow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="40%" stopColor="#60A5FA" />
      <stop offset="80%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-glow)" />

  <!-- Grid Accents -->
  <g opacity="0.12">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#312E81" stroke-width="1" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#312E81" stroke-width="1" />
  </g>

  <!-- Centered Lockup -->
  <g transform="translate(420, 160)">
    <!-- Symbol -->
    <g transform="scale(1.8)">
      <path
        d="M8 14.5 C8 11.5 10.5 9 13.5 9 H36 C44.837 9 52 16.163 52 25 C52 33.837 44.837 41 36 41 H28 V 33 H36 C40.418 33 44 29.418 44 25 C44 20.582 40.418 17 36 17 H13.5 C10.5 17 8 14.5 8 14.5 Z"
        fill="url(#og-flow-grad)"
      />
      <rect x="8" y="22" width="16" height="7" rx="3.5" fill="url(#og-flow-grad)" />
      <rect x="8" y="35" width="14" height="7" rx="3.5" fill="url(#og-flow-grad)" />
      <path
        d="M26 31.5 L46.8 52.3 C48.4 53.9 51 53.9 52.6 52.3 C54.2 50.7 54.2 48.1 52.6 46.5 L34.5 28.4 C32 25.9 27.5 27.7 26 31.5 Z"
        fill="url(#og-flow-grad)"
      />
    </g>

    <!-- Wordmark -->
    <text x="130" y="70" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5px">
      ResearchFlow<tspan fill="#818CF8">.AI</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <text x="600" y="375" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="-0.5px">
    Turn market research into decisions.
  </text>

  <!-- Core Loop -->
  <text x="600" y="435" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5px">
    RESEARCH → EVIDENCE → INTELLIGENCE → DECISION → EXECUTION
  </text>

  <!-- Bottom Badge -->
  <rect x="475" y="495" width="250" height="36" rx="18" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
  <text x="600" y="518" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#C7D2FE" text-anchor="middle">
    Autonomous Intelligence Platform
  </text>
</svg>
